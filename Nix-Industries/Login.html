<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <title>Login</title>

</head>
<body>

  <div class="form-container">

    <div class="logo">
      <img src="img/Nix Industries.png" alt="Nix Industries">
    </div>
  
   <!-- Main Card Container -->
  <div class="form-card">
      <div class="card-header">
        <h2>Seja bem vindo a Nix Industries</h2>
        <p>Soluções em materiais. Tecnologia que constrói o futuro.
Confiança que move negócios.</p>
       </div>

      

    <!-- Form Element -->
    <form action="#" method="POST">
      
        <div class="input-group">
          <label for="name">Nome Completo</label>
          <input type="text" id="name" name="name" placeholder="Seu nome" required>
        </div>
      
        <div class="input-group">
          <label for="name">Passaporte</label>
          <input type="number" id="passaporte" name="passaporte" placeholder="256" required>
        </div>

        <div class="input-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit-btn">Entrar</button>

        <p class="register-link">
          Ainda não tem uma conta?
          <a href="cadastrar.html">Cadastre-se</a>
        </p>
      
       </form>
    </div>
  </div>
    
</body>
</html>
